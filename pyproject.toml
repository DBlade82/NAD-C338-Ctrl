[project]
name = "nad-c338-development"
version = "0.1.0-beta.3"
description = "Development tools for the NAD C 338 Home Assistant integration"
license = "GPL-3.0-or-later"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.11.0",
    "mypy>=1.15",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
